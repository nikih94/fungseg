project:
  name: fungi_multiclass_segmentation

segmentation:
  mode: multiclass
  classes:
    background: 0
    loci: 1
    inoculum: 2
  overlap_precedence: inoculum

paths:
  images_dir: data/images
  mask_dirs:
    loci: data/loci_masks
    inoculum: data/inoculum_masks
  runs_dir: runs
  outputs_dir: outputs

join_masks:
  enabled: false
  masks_dir: data/join_masks
  merge_with_loci: false
  evaluation_enabled: true

data:
  image_extensions: [".png", ".jpg", ".jpeg", ".tif", ".tiff"]
  use_fives: false
  num_workers: 16
  persistent_workers: false
  prefetch_factor:  4
  pin_memory: true
  batch_size:  16
  image_size: null
  train_patch_cache:
    enabled: true

patching:
  patch_size: 512 # 1024 #512
  overlap: 256 #512 #256
  stride:  384 #768 #384 #256
  filter_empty_patches: true
  mask_threshold: 127
  min_foreground_pixels: 128
  image_resampling: lanczos
  mask_resampling: foreground_preserving
  train:
    random_offset:
      enabled: true
      max_fraction_of_patch: 0.5
    background_only:
      enabled: true
      percentage_of_foreground: 10.0
    scaled_context:
      enabled: false
      probability: 0.4
      max_scale: 4.0
      beta_alpha: 1.0
      beta_beta: 2.0
      containment_filter:
        enabled: true
        threshold: 0.8
        preserve_normal_patches: true
  validation:
    random_offset:
      enabled: false
    scaled_context:
      enabled: false

validation:
  start_epoch: 1
  full_image:
    enabled: true
    patch_cache:
      enabled: true
    batch_size: 16
    interval_epochs: 1
    selection: all
    max_images: null
    loss:
      patch_selection: non_overlapping
    composite_metrics:
      dice_cldice_per_image:
        weights:
          dice_per_image: 0.7
          cldice_per_image: 0.3
      dice_low_cldice_per_image:
        weights:
          dice_per_image: 0.9
          cldice_per_image: 0.1
      inoculum_compensated_per_image:
        weights:
          dice_loci_per_image: 0.3
          dice_inoculum_per_image: 0.5
          cldice_per_image: 0.2
    soft_cldice_foreground_only: true


augmentations:
  normalize: # do not touch this
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  train: # this can be edited
    horizontal_flip_p: 0.8
    vertical_flip_p: 0.5
    random_rotate_90_p: 0.8
    affine:
      translate_x: [-0.02, 0.02]
      translate_y: [-0.02, 0.02]
      scale: [0.90, 1.1]
      rotate: [-10, 10]
      p: 0.4
    random_brightness_contrast:
      brightness_limit: [-0.15, 0.15]
      contrast_limit: [-0.15, 0.15]
      p: 0.2
    random_gamma:
      gamma_limit: [90, 110]
      p: 0.2
    clahe:
      clip_limit: [1.0, 2.0]
      tile_grid_size: [8, 8]
      p: 0.1
    blur:
      gaussian_blur_limit: [3, 5]
      gaussian_sigma_limit: [0.2, 0.8]
      defocus_radius: [2, 3]
      defocus_alias_blur: [0.1, 0.3]
      p: 0.1
    gauss_noise_p: 0.05

cv:
  n_splits: 5
  shuffle_groups: true
  random_state: 42

split:
  mode: csv #, csv_kfold, train_val, or kfold
  csv_path: data/image_splits.csv
  val_source_ids: []

model:
  name: unetplusplus_resnet50
  in_channels: 3
  num_classes: 3
  encoder_name: resnet50
  encoder_weights: imagenet
  decoder_normalization: batchnorm
  decoder_channels:  [256, 128, 64, 64, 32] #[256, 128, 64, 32, 16]
  decoder_attention_type: null # set to scse to enable SMP scSE attention in the decoder, null for no attention

loss:
  name: multiclass_ce_dice_loci_cldice
  cross_entropy_weight: 0.25
  dice_weight: 0.5
  loci_cldice_weight: 0.25
  iterations: 140
  iterations_csv: null
  static_patch_iterations:
    enabled: true
    margin_iterations: 10
    round_up_to: 10
  smooth: 1.0e-6
  cldice_smooth: 1.0

optimizer:
  name: adamw
  encoder_lr: 1.0e-5
  decoder_lr: 1.0e-4
  weight_decay: 0.0001

scheduler:
  name: reduce_on_plateau
  mode: max
  factor: 0.5
  patience: 7
  threshold: 0.001
  threshold_mode: abs
  min_lr:
    encoder: 1.0e-7
    decoder: 1.0e-6
  monitor: val_dice_cldice_per_image



checkpointing:
  primary: current
  save_last: false
  interval:
    enabled: false
    interval_epochs: 10
  selections:
    current:
      enabled: true
      filename: best_current.pt
      monitor: val_dice_cldice_per_image
      mode: max
    dice:
      enabled: true
      filename: best_dice.pt
      monitor: val_dice_per_image
      mode: max
    low_cldice:
      enabled: true
      filename: best_low_cldice.pt
      monitor: val_dice_low_cldice_per_image
      mode: max
    inoculum_compensated:
      enabled: true
      filename: best_inoculum_compensated.pt
      monitor: val_inoculum_compensated_per_image
      mode: max
    validation_loss:
      enabled: false
      filename: best_val_loss.pt
      monitor: val_loss
      mode: min

train:
  epochs: 80
  mixed_precision: true
  grad_clip: 1.0
  threshold: 0.5
  seed: 42
  device: auto
  use_tqdm: true
  compute_hard_cldice_metrics: false

inference:
  decision: argmax
  save_probabilities: true

test_evaluation:
  enabled: true
  threshold_sweep: false

qualitative_evaluation:
  enabled: false
  data_root: null
  split: test
  crop_patch_grid: [3, 3]
  min_foreground_ratio: 0.005
  max_foreground_ratio: 0.15
  selection_seed: 42
  max_checkpoints: null
