project:
  name: fungi_multiclass_segmentation_segformer_mit_b3_geometry

segmentation:
  mode: multiclass
  classes:
    background: 0
    loci: 1
    inoculum: 2
  overlap_precedence: inoculum

paths:
  images_dir: data/images
  mask_dirs:
    loci: data/loci_masks
    inoculum: data/inoculum_masks
  runs_dir: runs
  outputs_dir: outputs

data:
  image_extensions: [".png", ".jpg", ".jpeg", ".tif", ".tiff"]
  use_fives: false
  num_workers: 4 # DEFAULT - 8, for segformer on 1024 use 4
  persistent_workers: false
  prefetch_factor: 4
  pin_memory: true
  batch_size: 8 # DEFAULT - 8, for segformer on 1024 use 4
  image_size: null

patching:
  patch_size: 512 #512
  overlap: 128 #256
  stride: 384 #256
  filter_empty_patches: true
  mask_threshold: 127
  min_foreground_pixels: 128
  image_resampling: lanczos
  mask_resampling: foreground_preserving
  train:
    random_offset:
      enabled: true
      max_fraction_of_patch: 0.4
    background_only:
      enabled: true
      percentage_of_foreground: 5.0
    scaled_context:
      enabled: true
      probability: 0.4
      max_scale: 4.0
      beta_alpha: 1.0
      beta_beta: 2.0
      containment_filter:
        enabled: true
        threshold: 0.8
        preserve_normal_patches: true
  validation:
    random_offset:
      enabled: false
    scaled_context:
      enabled: false

validation:
  fast:
    foreground_only: true
    overlap: 256
  full_image:
    enabled: false
    interval_epochs: 1
    selection: smallest_area
    max_images: 3
    monitor:
      dice_weight: 0.5
      cldice_weight: 0.5


augmentations:
  normalize: # do not touch this
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  train: # this can be edited
    horizontal_flip_p: 0.8
    vertical_flip_p: 0.5
    random_rotate_90_p: 0.8
    affine:
      translate_x: [-0.02, 0.02]
      translate_y: [-0.02, 0.02]
      scale: [0.90, 1.1]
      rotate: [-10, 10]
      p: 0.4
    random_brightness_contrast:
      brightness_limit: [-0.15, 0.15]
      contrast_limit: [-0.15, 0.15]
      p: 0.2
    random_gamma:
      gamma_limit: [90, 110]
      p: 0.2
    clahe:
      clip_limit: [1.0, 2.0]
      tile_grid_size: [8, 8]
      p: 0.1
    blur:
      gaussian_blur_limit: [3, 5]
      gaussian_sigma_limit: [0.2, 0.8]
      defocus_radius: [2, 3]
      defocus_alias_blur: [0.1, 0.3]
      p: 0.1
    gauss_noise_p: 0.05

cv:
  n_splits: 5
  shuffle_groups: true
  random_state: 42

split:
  mode: csv # csv, train_val, or kfold
  csv_path: data/image_splits.csv
  val_source_ids: []

model:
  name: segformer_mit_b3
  in_channels: 3
  num_classes: 3
  encoder_name: mit_b3
  encoder_weights: imagenet
  encoder_depth: 5
  decoder_segmentation_channels: 256
  upsampling: 4

loss:
  name: multiclass_geometry_ce_dice_loci_cldice
  geometry_aware_ce_weight: 0.25
  dice_weight: 0.55
  soft_cldice_weight: 0.20
  iterations: 30
  iterations_csv: null
  smooth: 1.0e-6
  cldice_smooth: 1.0
  geometry_aware_ce:
    center_multiplier: 2.0
    center_gamma: 2.0
    separator_enabled: true
    separator_multiplier: 3.0
    separator_radius_multipliers: [0.5, 1.0, 1.5]

optimizer:
  name: adamw
  encoder_lr: 1.0e-5
  decoder_lr: 1.0e-4
  weight_decay: 0.0001

scheduler:
  name: reduce_on_plateau
  mode: max
  factor: 0.5
  patience: 7
  min_lr:
    encoder: 1.0e-7
    decoder: 1.0e-6
  monitor: val_dice_per_patch



train:
  epochs: 60
  mixed_precision: true
  grad_clip: 1.0
  monitor: val_dice_per_patch
  monitor_mode: max
  best_interval_checkpoint:
    enabled: true
    interval_epochs: 10
  threshold: 0.5
  seed: 42
  device: auto
  use_tqdm: true

inference:
  decision: argmax
  save_probabilities: true

test_evaluation:
  enabled: true
  threshold_sweep: false

qualitative_evaluation:
  enabled: true
  data_root: null
  split: test
  crop_patch_grid: [3, 3]
  min_foreground_ratio: 0.005
  max_foreground_ratio: 0.15
  selection_seed: 42
  max_checkpoints: null
